<script>  
const video = document.getElementById('video');
const captureBtn = document.getElementById('capture-btn');
const canvas = document.getElementById('outputCanvas');
const guideFrame = document.getElementById('guide-frame');
const actionBtns = document.getElementById('actionBtns');
const sendBtn = document.getElementById('sendBtn');
const backCaptureBtn = document.getElementById('backCaptureBtn');
const retryBackBtn = document.getElementById('retryBackBtn');
const retryAllBtn = document.getElementById('retryAllBtn');

let isDetecting = true;
let globalCardId = null; 
let isFrontSide = true; 
let capturedImages = { front: null, back: null };
let captureCounter = 0;
let detectedPoints = null; // ★グローバルで保持（detectLoopとcaptureBtn間で共有）

const mockData = [
  { id: 1, name: "山田 太郎", company: "株式会社サンプル", image: "url_to_image" },
  { id: 2, name: "佐藤 花子", company: "デザイン事務所", image: "url_to_image" }
];

document.getElementById('loginBtn').addEventListener('click', async () => {
  const loginBtn = document.getElementById('loginBtn');
  const id = document.getElementById('loginId').value;
  const pass = document.getElementById('loginPass').value;
  
  loginBtn.disabled = true;
  const originalText = loginBtn.textContent;
  loginBtn.textContent = "ログイン処理中...";
  loginBtn.style.backgroundColor = "#ccc";
  
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyya3RzVXc9pdWUCNhBaJN-F7_ShidH16FVFuL5VMh1CFLDifyAnUBkM-Z987FKb8o0/exec"; 

  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "login", id: id, pass: pass })
    });
    const result = await response.json();

    if (result.success) {
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('userName', result.userName);
      sessionStorage.setItem('loginTime', new Date().getTime().toString());
      showPage('page-camera');
      document.getElementById('bottom-nav').style.display = 'flex';
    } else {
      alert("IDまたはパスワードが違います");
      loginBtn.disabled = false;
      loginBtn.textContent = originalText;
      loginBtn.style.backgroundColor = "#007bff";
    }
  } catch (e) {
    console.error(e);
    alert("通信エラーが発生しました");
    loginBtn.disabled = false;
    loginBtn.textContent = originalText;
    loginBtn.style.backgroundColor = "#007bff";
  }
});
  
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(pageId).style.display = 'block';
  
  if (pageId === 'page-camera') {
    if (!video.srcObject) {
      startCamera();
    }
    isDetecting = true;
    detectLoop();
  } else {
    isDetecting = false;
  }
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const filtered = mockData.filter(item => 
    item.name.toLowerCase().includes(query) || item.company.toLowerCase().includes(query)
  );
  renderCards(filtered);
});

async function startCamera() {
  const constraints = {
    video: {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      facingMode: { ideal: "environment" },
      advanced: [{ focusMode: "continuous" }]
    }
  };
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.onloadedmetadata = () => detectLoop();
  } catch (err) { alert("カメラアクセスを許可してください"); }
}

function showNotification(msg) {
  let toast = document.getElementById('camera-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'camera-toast';
    toast.style.cssText = `
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.3s;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => {
    toast.style.opacity = '0';
  }, 2500);
}

// リアルタイム輪郭検知ループ
function detectLoop() {
  if (!isDetecting) return;
  if (!video || video.readyState !== 4) {
    setTimeout(() => requestAnimationFrame(detectLoop), 200);
    return;
  }
  if (video.style.display === 'none') return;
  
  let fullMat = cv.imread(video);
  let width = fullMat.cols;
  let height = fullMat.rows;

  // detectLoop 内の解析範囲を90%に広げる
  let roiRect = new cv.Rect(
    Math.floor(width * 0.05),
    Math.floor(height * 0.05),
    Math.floor(width * 0.9),
    Math.floor(height * 0.9)
  );

  let roiMat = fullMat.roi(roiRect);
  let gray = new cv.Mat();
  let blur = new cv.Mat();
  let thresh = new cv.Mat();
  let canny = new cv.Mat();
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();

  // 1. グレースケール ＋ ぼかし
  cv.cvtColor(roiMat, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);

  // 2. 二値化（大津の閾値処理）
  cv.threshold(blur, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);

  // 3. エッジ検出と最外郭輪郭抽出
  cv.Canny(thresh, canny, 50, 150);
  cv.findContours(canny, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let found = false;
  let roiArea = roiMat.cols * roiMat.rows;
  let minArea = roiArea * 0.10;
  let maxAreaThreshold = roiArea * 0.95;
  let maxFoundArea = 0;

  for (let i = 0; i < contours.size(); ++i) {
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);

    if (area < minArea || area > maxAreaThreshold) continue;

    let approx = new cv.Mat();
    cv.approxPolyDP(cnt, approx, 0.04 * cv.arcLength(cnt, true), true);
    
    let rect = cv.boundingRect(cnt);
    let aspectRatio = rect.width / rect.height;

    // 条件：4角形 ＆ 名刺比率 ＆ 最大面積
    if (approx.rows === 4 && (aspectRatio >= 1.3 && aspectRatio <= 1.9)) {
      if (area > maxFoundArea) {
        maxFoundArea = area;
        found = true;
        
        detectedPoints = [];
        for (let j = 0; j < 4; j++) {
          detectedPoints.push({ 
            x: approx.data32S[j * 2], 
            y: approx.data32S[j * 2 + 1] 
          });
        }
      }
    }
    approx.delete();
  }

  if (!found) {
    detectedPoints = null;
  }

  // ガイド枠の色切り替え
  if (guideFrame) {
    if (found) {
      guideFrame.classList.remove('guide-default');
      guideFrame.classList.add('guide-detected');
    } else {
      guideFrame.classList.remove('guide-detected');
      guideFrame.classList.add('guide-default');
    }
  }

  // 4フレーム連続検知で自動撮影
  if (found) {
    captureCounter++;
    if (captureCounter >= 4) {
      captureCounter = 0;
      captureBtn.click();
    }
  } else {
    captureCounter = 0;
  }

  // メモリ解放
  roiMat.delete(); gray.delete(); blur.delete(); thresh.delete(); canny.delete(); contours.delete(); hierarchy.delete(); fullMat.delete();
  
  if (isDetecting) {
    setTimeout(() => requestAnimationFrame(detectLoop), 150);
  }
}

// 手動撮影時のフォールバック用：静止画から輪郭を再検索する関数
function findCardPointsFromMat(srcMat) {
  let gray = new cv.Mat();
  let blur = new cv.Mat();
  let thresh = new cv.Mat();
  let canny = new cv.Mat();
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();

  cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
  cv.threshold(blur, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);

  cv.Canny(thresh, canny, 30, 100);
  cv.findContours(canny, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let bestPoints = null;
  let maxArea = 0;
  const minRequiredArea = (srcMat.cols * srcMat.rows) * 0.08;

  for (let i = 0; i < contours.size(); ++i) {
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);

    if (area < minRequiredArea) continue;

    let approx = new cv.Mat();
    cv.approxPolyDP(cnt, approx, 0.04 * cv.arcLength(cnt, true), true);
    
    let rect = cv.boundingRect(cnt);
    let aspectRatio = rect.width / rect.height;

    if (approx.rows === 4 && (aspectRatio >= 1.2 && aspectRatio <= 2.0)) {
      if (area > maxArea) {
        maxArea = area;
        bestPoints = [];
        for (let j = 0; j < 4; j++) {
          bestPoints.push({ 
            x: approx.data32S[j * 2], 
            y: approx.data32S[j * 2 + 1] 
          });
        }
      }
    }
    approx.delete();
  }

  gray.delete(); blur.delete(); thresh.delete(); canny.delete(); contours.delete(); hierarchy.delete();
  return bestPoints;
}

// 4頂点指定による透視変換関数
function warpPerspectiveFromPoints(src, points) {
  // 左上・右上・右下・左下に並べ替え
  points.sort((a, b) => a.y - b.y);
  let top = points.slice(0, 2).sort((a, b) => a.x - b.x);
  let bottom = points.slice(2, 4).sort((a, b) => a.x - b.x);
  let sortedPoints = [top[0], top[1], bottom[1], bottom[0]];

  let dstWidth = 800, dstHeight = 500;
  canvas.width = dstWidth; 
  canvas.height = dstHeight;
  
  let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
    sortedPoints[0].x, sortedPoints[0].y, sortedPoints[1].x, sortedPoints[1].y,
    sortedPoints[2].x, sortedPoints[2].y, sortedPoints[3].x, sortedPoints[3].y
  ]);
  let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstWidth, 0, dstWidth, dstHeight, 0, dstHeight]);
  let M = cv.getPerspectiveTransform(srcTri, dstTri);
  let dst = new cv.Mat();
  
  cv.warpPerspective(src, dst, M, new cv.Size(dstWidth, dstHeight));
  let normalized = new cv.Mat();
  cv.normalize(dst, normalized, 0, 255, cv.NORM_MINMAX);
  
  cv.imshow('outputCanvas', normalized);
  
  normalized.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();
}

// 撮影ボタン押下処理（フォールバック3段階）
captureBtn.addEventListener('click', async () => {
  if (!globalCardId) globalCardId = Date.now();  
  
  isDetecting = false; // 検知ループを停止
  
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = video.videoWidth; 
  tempCanvas.height = video.videoHeight;
  const ctx = tempCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  let src = cv.imread(tempCanvas);
  let finalPoints = null;

  // 【ステップ1】 detectLoop でリアルタイム検知できていた座標があるか？
  if (detectedPoints && detectedPoints.length === 4) {
    let roiOffsetX = Math.floor(video.videoWidth * 0.1);
    let roiOffsetY = Math.floor(video.videoHeight * 0.1);

    finalPoints = detectedPoints.map(pt => ({
      x: pt.x + roiOffsetX,
      y: pt.y + roiOffsetY
    }));
  } else {
    // 【ステップ2】 無ければ撮影画像全体から「再度の補正（輪郭検索）」にチャレンジ！
    finalPoints = findCardPointsFromMat(src);
  }

  // 判定とクロップ処理の分岐
  if (finalPoints) {
    // ★補正成功：見つかった4頂点で歪み補正・切り出し
    warpPerspectiveFromPoints(src, finalPoints);
  } else {
    // ★補正失敗（未検知）：ガイド枠のサイズで直接トリミング
    const cropX = Math.floor(video.videoWidth * 0.05);
    const cropY = Math.floor(video.videoHeight * 0.05);
    const cropWidth = Math.floor(video.videoWidth * 0.9);
    const cropHeight = Math.floor(video.videoWidth * (55 / 91));

    canvas.width = cropWidth;
    canvas.height = cropHeight;
    const canvasCtx = canvas.getContext('2d');

    canvasCtx.drawImage(
      tempCanvas,
      cropX, cropY, cropWidth, cropHeight,
      0, 0, cropWidth, cropHeight
    );
  }

  // プレビュー反映
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  
  if (isFrontSide) {
    capturedImages.front = dataUrl;
    document.getElementById('previewFront').src = dataUrl;
    document.getElementById('previewFront').style.display = 'block';
  } else {
    capturedImages.back = dataUrl;
    document.getElementById('previewBack').src = dataUrl;
    document.getElementById('previewBack').style.display = 'block';
  }
  
  // 表示切替
  video.style.display = 'none';
  canvas.style.display = 'none';
  if (guideFrame) guideFrame.style.display = 'none';
  
  showActionUI();

  // 後処理
  src.delete();
  detectedPoints = null;
});

backCaptureBtn.addEventListener('click', () => {
  isFrontSide = false;
  showCaptureUI();
  isDetecting = true;
  detectLoop();
});

retryBackBtn.addEventListener('click', () => {
  isFrontSide = false;
  capturedImages.back = null;
  document.getElementById('previewBack').src = "";
  document.getElementById('previewBack').style.display = 'none';
  showCaptureUI();
  isDetecting = true;
  detectLoop();
});

retryAllBtn.addEventListener('click', () => {
  globalCardId = null;
  isFrontSide = true;
  capturedImages = { front: null, back: null };
  resetPreview();
  showCaptureUI();
  isDetecting = true;
  detectLoop();
}); 

function showActionUI() {
  captureBtn.style.display = 'none';
  actionBtns.style.display = 'flex';
  
  if (capturedImages.back) {
    backCaptureBtn.style.display = 'none';
    retryBackBtn.style.display = 'block';
  } else {
    backCaptureBtn.style.display = 'block';
    retryBackBtn.style.display = 'none';
  }
}

function showCaptureUI() {
  captureBtn.style.display = 'block';
  actionBtns.style.display = 'none';
  
  canvas.style.display = 'none';
  video.style.display = 'block';
  
  if (guideFrame) {
    guideFrame.style.display = 'block';
    guideFrame.classList.remove('guide-detected');
    guideFrame.classList.add('guide-default');
  }
}

function resetPreview() {
  document.getElementById('previewFront').style.display = 'none';
  document.getElementById('previewBack').style.display = 'none';
  document.getElementById('previewFront').src = "";
  document.getElementById('previewBack').src = "";
}

async function uploadAllImages() {
  const userName = sessionStorage.getItem('userName');
  const cloudRunUrl = 'https://upload-meishi-function-769951420007.asia-northeast2.run.app';

  if (capturedImages.front) {
    const frontPayload = {
      base64Data: capturedImages.front.split(',')[1],
      fileName: `card_${globalCardId}_front.jpg`
    };
    const res1 = await fetch(cloudRunUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(frontPayload)
    });
    if (!res1.ok) throw new Error("表面送信失敗: " + await res1.text());
  }

  if (capturedImages.back) {
    const backPayload = {
      base64Data: capturedImages.back.split(',')[1],
      fileName: `card_${globalCardId}_back.jpg`
    };
    const res2 = await fetch(cloudRunUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(backPayload)
    });
    if (!res2.ok) throw new Error("裏面送信失敗: " + await res2.text());
  }
  
  return true;
}

sendBtn.addEventListener('click', async () => {
  if (!capturedImages.front) {
    alert("表面が撮影されていません");
    return;
  }

  sendBtn.disabled = true;
  const originalText = sendBtn.textContent;
  sendBtn.textContent = "送信中...";

  try {
    await uploadAllImages();
    alert("送信完了しました");
    
    globalCardId = null;
    isFrontSide = true;
    capturedImages = { front: null, back: null };
    resetPreview();
    showCaptureUI();
  } catch (e) {
    alert("エラー: " + e.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = originalText;
  }
});

window.addEventListener('load', () => {
  const loginTime = sessionStorage.getItem('loginTime');
  const now = new Date().getTime();
  
  if (loginTime && (now - Number(loginTime) > 3600000)) {
    sessionStorage.clear();
    showPage('page-login');
  } else {  
    renderCards(mockData);
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      showPage('page-camera');
      document.getElementById('bottom-nav').style.display = 'flex';
    } else {
      showPage('page-login');
      document.getElementById('bottom-nav').style.display = 'none';
    }
  }
});

function renderCards(dataList) {
  const container = document.getElementById('card-container');
  container.innerHTML = "";

  dataList.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div>
        <h3>${item.name}</h3>
        <p>${item.company}</p>
      </div>
      <button class="detail-btn" onclick="openDetail(${item.id})">詳細</button>
    `;
    container.appendChild(card);
  });
}

function openDetail(id) {
  const item = mockData.find(d => d.id === id);
  alert(`詳細表示: ${item.name} - ${item.company}`);
} 
</script>
</body>
</html>
