<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>酒ゃビック名刺管理システム</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg-dark: #0f172a;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --radius-lg: 20px;
    --radius-md: 12px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  input, button {
    font-family: inherit;
    outline: none;
  }

  .page {
    height: calc(100vh - 65px);
    width: 100vw;
    overflow-y: auto;
    display: none;
    box-sizing: border-box;
  }

  /* 縦画面警告オーバーレイ */
  #orientation-warning {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #ffffff;
    padding: 20px;
  }

  /* ログイン */
  #page-login {
    height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    padding: 36px 28px;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    text-align: center;
  }

  .login-box h2 {
    margin: 0 0 8px 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
  }

  .login-box p.subtitle {
    margin: 0 0 24px 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .input-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 1.5px solid #e2e8f0;
    border-radius: var(--radius-md);
    background: #f8fafc;
    transition: all 0.2s;
  }

  .input-group input:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    transition: all 0.2s ease;
  }

  /* カメラ画面 */
  #camera-container {
    position: relative;
    width: 100vw;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    overflow: hidden;
  }

  #video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* ガイド枠の基本構造・通常時（非検知状態：白破線） */
  #guide-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 82vw;
    max-width: 380px;
    height: calc(82vw * 55 / 91);
    max-height: calc(380px * 55 / 91);
    box-sizing: border-box;
    pointer-events: none;
    z-index: 10;
    border-radius: 12px;
    border: 3px dashed rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    transition: all 0.2s ease;
  }

  /* 検知時（緑色・実線） */
  #guide-frame.detected {
    border: 4px solid #10b981 !important;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.8) !important;
  }

  #status-message {
    position: relative;
    z-index: 12;
    margin-top: 25px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    color: #ffffff;
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  #status-message.detected {
    background: rgba(16, 185, 129, 0.9);
    color: #ffffff;
  }   

 /* 撮影後のガイドプレビュー（表面単体表示時） */
  #guidePreview {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    width: 82vw;
    max-width: 380px;
    height: calc(82vw * 55 / 91);
    max-height: calc(380px * 55 / 91);
    border-radius: 12px;
    object-fit: contain;
    background: #000;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    display: none;
  }

  /* 表裏2枚の縦並びプレビューコンテナ */
  #previewContainer {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-height: 70vh;
    overflow-y: auto;
  }

  /* プレビューカード（表面プレビューと同等のサイズに拡大） */
  .preview-card {
    width: 78vw;
    max-width: 340px;
    height: calc(78vw * 55 / 91);
    max-height: calc(340px * 55 / 91);
    border-radius: 12px;
    object-fit: contain;
    background: #000;
    border: 2px solid #ffffff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  /* コントロール（ボタン類）のレイヤー設定 */
  #controls {
    position: absolute;
    bottom: 30px;
    left: 0;
    z-index: 30; /* プレビューより前面に表示 */
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 20px;
  }

  /* シャッターボタン */
  #capture-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: transparent;
    border: 4px solid #ffffff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
    position: relative;
    z-index: 30;
  }

  #capture-btn::after {
    content: "";
    width: 54px;
    height: 54px;
    background-color: #ffffff;
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  #capture-btn.active::after {
    background-color: #10b981;
    transform: scale(0.9);
  }

  #actionBtns {
    display: none;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 110px;
    height: 48px;
    border: none;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #sendBtn { background: var(--success); }
  #backCaptureBtn { background: var(--warning); }
  #retryBackBtn { background: #d97706; }
  #retryAllBtn { background: var(--danger); }

  /* 下部ナビゲーションバー */
  #bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    height: 65px;
    background: #1e293b;
    display: none;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  #bottom-nav button {
    flex: 1;
    height: 100%;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #bottom-nav button span {
    font-size: 20px;
  }

  #bottom-nav button.active {
    color: #ffffff;
    font-weight: bold;
  }

  /* 検索画面CSS */
  .search-header { padding: 16px; }
  .search-header input {
    width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid #334155; background: #1e293b; color: #fff;
  }
  #card-container { padding: 0 16px; }
  .card {
    background: #1e293b; color: #fff; padding: 16px; border-radius: var(--radius-md); margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card h3 { margin: 0 0 4px 0; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; color: #94a3b8; }
  .detail-btn { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; }

  /* 検索画面CSS (Eight風デザイン) */
  .search-header {
    position: sticky;
    top: 0;
    background: var(--bg-dark);
    padding: 16px;
    z-index: 20;
    border-bottom: 1px solid #334155;
  }
  .search-header input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 25px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 15px;
  }
  #card-container {
    padding: 12px 16px 80px 16px;
  }

  /* Eight風カードスタイリング */
  .eight-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    border: 1px solid #334155;
    transition: transform 0.1s ease;
  }
  .eight-card:active {
    transform: scale(0.98);
  }
  .card-thumb-box {
    width: 72px;
    height: 44px;
    border-radius: 6px;
    overflow: hidden;
    background: #0f172a;
    flex-shrink: 0;
    border: 1px solid #475569;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-thumb-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-thumb-placeholder {
    font-size: 11px;
    color: #64748b;
  }
  .card-info {
    flex: 1;
    overflow: hidden;
  }
  .card-name {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    margin: 0 0 2px 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .card-kana {
    font-size: 11px;
    color: #94a3b8;
    font-weight: normal;
  }
  .card-company {
    font-size: 13px;
    color: #cbd5e1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
  }
  .card-dept {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .card-date {
    font-size: 10px;
    color: #64748b;
    margin-top: 4px;
  }

  /* 詳細・編集モーダル */
  #detail-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    z-index: 200;
    display: none;
    flex-direction: column;
  }
  .modal-header {
    height: 56px;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #334155;
  }
  .modal-header h3 { margin: 0; font-size: 17px; }
  .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-images {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .modal-img-card {
    flex: 1;
    min-width: 140px;
    height: 90px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid #475569;
    background: #000;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 14px;
  }
  .modal-footer {
    padding: 12px 16px;
    border-top: 1px solid #334155;
    background: #0f172a;
  }
  
</style>
  <script src="https://cdn.jsdelivr.net/npm/opencv.js@1.2.1/opencv.js"></script>
</head>
<body>

<div id="orientation-warning">
  <div style="font-size: 48px; margin-bottom: 16px;">📱</div>
  <p style="font-size: 20px; font-weight: 700; margin: 0 0 10px 0;">画面を縦向きにしてください</p>
  <p style="font-size: 14px; color: #94a3b8; margin: 0;">本システムは縦向き表示専用です</p>
</div>

<div id="page-login" class="page">
  <div class="login-box">
    <h2>酒ゃビック名刺管理</h2>
    <p class="subtitle">アカウント情報を入力してログイン</p>
    <div class="input-group">
      <input type="text" id="loginId" placeholder="ユーザーID">
    </div>
    <div class="input-group">
      <input type="password" id="loginPass" placeholder="パスワード">
    </div>
    <button id="loginBtn" class="btn-primary">ログイン</button>
  </div>
</div>
  
<div id="page-camera" class="page">
  <div id="camera-container">
    <div id="status-message">名刺をガイド枠内に合わせてください</div>
    <video id="video" playsinline autoplay></video>
    <div id="guide-frame"></div>
    <img id="guidePreview" style="display: none;" />
    
    <div id="previewContainer">
      <img id="previewFront" class="preview-card" alt="表面">
      <img id="previewBack" class="preview-card" alt="裏面">
    </div>

    <canvas id="outputCanvas" style="display:none;"></canvas>
    
    <div id="controls">
      <div id="capture-btn"></div>

      <div id="actionBtns">
        <button id="sendBtn" class="action-btn">送信する</button>
        <button id="backCaptureBtn" class="action-btn">裏面を撮影</button>
        <button id="retryBackBtn" class="action-btn">裏面撮り直し</button>
        <button id="retryAllBtn" class="action-btn">最初から直す</button>
      </div>
    </div>
  </div>
</div>
  
<div id="page-search" class="page">
  <div class="search-header">
    <input type="text" id="searchInput" placeholder="会社名や氏名で検索...">
  </div>
  <div id="card-container"></div>
</div>

<!-- 詳細・編集モーダル -->
<div id="detail-modal">
  <div class="modal-header">
    <h3>名刺詳細・編集</h3>
    <button class="close-btn" onclick="closeDetailModal()">&times;</button>
  </div>
  <div class="modal-body">
    <div class="modal-images">
      <img id="m-front-img" class="modal-img-card" alt="表面" style="display:none;" />
      <img id="m-back-img" class="modal-img-card" alt="裏面" style="display:none;" />
    </div>

    <input type="hidden" id="edit-rowIndex">
    <div class="form-group">
      <label>会社名</label>
      <input type="text" id="edit-company">
    </div>
    <div class="form-group">
      <label>会社名 (かな)</label>
      <input type="text" id="edit-companyKana">
    </div>
    <div class="form-group">
      <label>氏名</label>
      <input type="text" id="edit-name">
    </div>
    <div class="form-group">
      <label>氏名 (かな)</label>
      <input type="text" id="edit-nameKana">
    </div>
    <div class="form-group">
      <label>部署</label>
      <input type="text" id="edit-department">
    </div>
    <div class="form-group">
      <label>役職</label>
      <input type="text" id="edit-title">
    </div>
    <div class="form-group">
      <label>電話番号</label>
      <input type="text" id="edit-phone">
    </div>
    <div class="form-group">
      <label>携帯電話</label>
      <input type="text" id="edit-mobile">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" id="edit-email">
    </div>
    <div class="form-group">
      <label>郵便番号</label>
      <input type="text" id="edit-zipCode">
    </div>
    <div class="form-group">
      <label>住所</label>
      <input type="text" id="edit-address">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-primary" id="saveCardBtn" onclick="saveCardEdit()">変更を保存する</button>
  </div>
</div>  
<nav id="bottom-nav">
  <button id="nav-camera" class="active" onclick="showPage('page-camera')">
    <span>📷</span> 撮影
  </button>
  <button id="nav-search" onclick="showPage('page-search')">
    <span>🔍</span> 検索
  </button>
</nav>

<script>  
const video = document.getElementById('video');
const captureBtn = document.getElementById('capture-btn');
const canvas = document.getElementById('outputCanvas');
const guideFrame = document.getElementById('guide-frame');
const actionBtns = document.getElementById('actionBtns');
const sendBtn = document.getElementById('sendBtn');
const backCaptureBtn = document.getElementById('backCaptureBtn');
const retryBackBtn = document.getElementById('retryBackBtn');
const retryAllBtn = document.getElementById('retryAllBtn');

let isDetecting = true;
let globalCardId = null; 
let isFrontSide = true; 
let capturedImages = { front: null, back: null };

let isDetected = false;
let lastDetectedQuad = null;
let allCardsData = []; // スプレッドシートから取得した名刺データ全件  

const mockData = [
  { id: 1, name: "山田 太郎", company: "株式会社サンプル", image: "url_to_image" },
  { id: 2, name: "佐藤 花子", company: "デザイン事務所", image: "url_to_image" }
];

async function enforcePortraitOrientation() {
  if (screen.orientation && screen.orientation.lock) {
    try {
      await screen.orientation.lock('portrait');
    } catch (e) {
      console.log("screen.orientation.lock 非対応:", e);
    }
  }
  checkOrientation();
}

function checkOrientation() {
  const warningEl = document.getElementById('orientation-warning');
  const isLandscape = window.innerWidth > window.innerHeight;

  if (isLandscape) {
    if (warningEl) warningEl.style.display = 'flex';
    isDetecting = false;
  } else {
    if (warningEl) warningEl.style.display = 'none';
    
    const cameraPage = document.getElementById('page-camera');
    if (cameraPage && cameraPage.style.display !== 'none' && !isDetecting && video.srcObject) {
      isDetecting = true;
      detectLoop();
    }
  }
}

window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

// ログイン処理
document.getElementById('loginBtn')?.addEventListener('click', async () => {
  const loginBtn = document.getElementById('loginBtn');
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value.trim();

  if (!id || !pass) {
    alert("ユーザーIDとパスワードを入力してください");
    return;
  }

  loginBtn.disabled = true;
  const originalText = loginBtn.textContent;
  loginBtn.textContent = "ログイン処理中...";
  loginBtn.style.opacity = "0.7";
  
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyya3RzVXc9pdWUCNhBaJN-F7_ShidH16FVFuL5VMh1CFLDifyAnUBkM-Z987FKb8o0/exec"; 

  try {
    const payload = { action: "login", id: id, pass: pass };
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.success) {
      sessionStorage.setItem('isLoggedIn', 'true');
      // ↓ この行を追加して userCode を保存します
      sessionStorage.setItem('userCode', result.userCode || id);
      sessionStorage.setItem('userName', result.userName || id);
      sessionStorage.setItem('loginTime', new Date().getTime().toString());
      showPage('page-camera');
      document.getElementById('bottom-nav').style.display = 'flex';
    } else {
      alert(result.message || "IDまたはパスワードが違います");
      loginBtn.disabled = false;
      loginBtn.textContent = originalText;
      loginBtn.style.opacity = "1";
    }
  } catch (e) {
    console.error(e);
    alert("通信エラーが発生しました: " + e.message);
    loginBtn.disabled = false;
    loginBtn.textContent = originalText;
    loginBtn.style.opacity = "1";
  }
});
  
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  const targetPage = document.getElementById(pageId);
  if (targetPage) {
    targetPage.style.display = 'block';
  } else {
    return;
  }

  document.querySelectorAll('#bottom-nav button').forEach(btn => btn.classList.remove('active'));
  if (pageId === 'page-camera') document.getElementById('nav-camera')?.classList.add('active');
  if (pageId === 'page-search') document.getElementById('nav-search')?.classList.add('active');

  if (pageId === 'page-camera') {
    if (!video.srcObject) {
      startCamera();
    }
    checkOrientation();
    if (window.innerWidth <= window.innerHeight) {
      isDetecting = true;
      detectLoop();
    }
  } else {
    isDetecting = false;
  }
  if (pageId === 'page-search') {
    isDetecting = false;
    fetchCardsData(); // ★検索ページ表示時に最新一覧をロード
  }
}

document.getElementById('searchInput')?.addEventListener('input', (e) => {

  );

async function startCamera() {
  await enforcePortraitOrientation();
  const constraints = {
    video: {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      facingMode: { ideal: "environment" }
    }
  };
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      checkOrientation();
      if (window.innerWidth <= window.innerHeight) {
        detectLoop();
      }
    };
  } catch (err) { alert("カメラアクセスを許可してください"); }
}

// --------------------------------------------------
// OpenCV 4頂点検知（元の認識ロジックそのまま）
// --------------------------------------------------
function findCardQuad(srcMat) {
  let gray = new cv.Mat();
  let equalized = new cv.Mat();
  let edges = new cv.Mat();
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();

  // コントラスト強調 + エッジ検出
  cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
  cv.equalizeHist(gray, equalized);
  cv.Canny(equalized, edges, 70, 200);

  let kernel = cv.Mat.ones(3, 3, cv.CV_8U);
  cv.dilate(edges, edges, kernel);

  cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let bestQuad = null;
  let maxDetectedArea = 0;
  let fullArea = srcMat.cols * srcMat.rows;
  
  let minArea = fullArea * 0.15;
  let maxArea = fullArea * 0.80;

  for (let i = 0; i < contours.size(); ++i) {
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);

    if (area >= minArea && area <= maxArea && area > maxDetectedArea) {
      let approx = new cv.Mat();
      let perimeter = cv.arcLength(cnt, true);
      cv.approxPolyDP(cnt, approx, 0.03 * perimeter, true);

      let rect = cv.boundingRect(cnt);
      let aspectRatio = rect.width / rect.height;
      let isGoodRatio = (aspectRatio >= 1.2 && aspectRatio <= 2.2) || (aspectRatio >= 0.45 && aspectRatio <= 0.85);

      if (isGoodRatio) {
        if (approx.rows === 4) {
          let quadCandidate = [];
          for (let j = 0; j < 4; j++) {
            quadCandidate.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
          }
          bestQuad = quadCandidate;
          maxDetectedArea = area;
        }
      }
      approx.delete();
    }
  }

  kernel.delete(); gray.delete(); equalized.delete(); edges.delete(); contours.delete(); hierarchy.delete();
  return bestQuad;
}

// --------------------------------------------------
// リアルタイム認識ループ
// --------------------------------------------------
function detectLoop() {
  if (!isDetecting) return;
  if (!video || video.readyState !== 4) {
    setTimeout(() => requestAnimationFrame(detectLoop), 200);
    return;
  }
  if (video.style.display === 'none') return;

  let fullMat = cv.imread(video);
  let quad = findCardQuad(fullMat);

  const statusEl = document.getElementById('status-message');
  const guideEl = document.getElementById('guide-frame');
  const captureBtn = document.getElementById('capture-btn');

  if (quad) {
    isDetected = true;
    lastDetectedQuad = quad;

    if (guideEl) {
      guideEl.classList.add('detected');
    }
    if (statusEl) {
      statusEl.classList.add('detected');
      statusEl.textContent = '名刺を検知しました (ボタンを押して撮影)';
    }
    if (captureBtn) {
      captureBtn.classList.add('active');
    }
  } else {
    isDetected = false;
    lastDetectedQuad = null;

    if (guideEl) {
      guideEl.classList.remove('detected');
    }
    if (statusEl) {
      statusEl.classList.remove('detected');
      statusEl.textContent = 'ガイド枠内に合わせてください (タップで手動撮影)';
    }
    if (captureBtn) {
      captureBtn.classList.remove('active');
    }
  }

  fullMat.delete();
  setTimeout(() => requestAnimationFrame(detectLoop), 200);
}

function sortPoints(pts) {
  pts.sort((a, b) => a.y - b.y);
  let topPts = pts.slice(0, 2).sort((a, b) => a.x - b.x);
  let bottomPts = pts.slice(2, 4).sort((a, b) => a.x - b.x);
  return [topPts[0], topPts[1], bottomPts[1], bottomPts[0]];
}

function warpPerspective(srcMat, quadPoints) {
  try {
    let sorted = sortPoints(quadPoints);
    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      sorted[0].x, sorted[0].y,
      sorted[1].x, sorted[1].y,
      sorted[2].x, sorted[2].y,
      sorted[3].x, sorted[3].y
    ]);

    const cardWidth = 800;
    const cardHeight = 484;

    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0, 0,
      cardWidth, 0,
      cardWidth, cardHeight,
      0, cardHeight
    ]);

    let M = cv.getPerspectiveTransform(srcTri, dstTri);
    let dst = new cv.Mat();
    cv.warpPerspective(srcMat, dst, M, new cv.Size(cardWidth, cardHeight));

    let outputCanvas = document.getElementById('outputCanvas');
    outputCanvas.width = cardWidth;
    outputCanvas.height = cardHeight;
    cv.imshow('outputCanvas', dst);

    srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
    return true;
  } catch (e) {
    console.error('Warp error:', e);
    return false;
  }
}

function cropFallbackROI(srcMat) {
  let w = srcMat.cols;
  let h = srcMat.rows;

  let cropW = Math.floor(w * 0.82);
  let cropH = Math.floor(cropW * 55 / 91);
  let startX = Math.floor((w - cropW) / 2);
  let startY = Math.floor((h - cropH) / 2);

  let rect = new cv.Rect(startX, startY, cropW, cropH);
  let roi = srcMat.roi(rect);

  let outputCanvas = document.getElementById('outputCanvas');
  outputCanvas.width = cropW;
  outputCanvas.height = cropH;
  cv.imshow('outputCanvas', roi);

  roi.delete();
}

// 短いカードIDを生成する関数（例: "260929-a8f"）
function generateShortCardId() {
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const rand = Math.random().toString(36).substring(2, 5); // ランダム英数字3文字
  return `${yy}${mm}${dd}-${rand}`;
}
  
// シャッターボタンタップ時
document.getElementById('capture-btn').addEventListener('click', async () => {
  if (!globalCardId) globalCardId = generateShortCardId();
  isDetecting = false;

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = video.videoWidth; 
  tempCanvas.height = video.videoHeight;
  tempCanvas.getContext('2d').drawImage(video, 0, 0);

  let src = cv.imread(tempCanvas);
  let success = false;

  if (isDetected && lastDetectedQuad) {
    success = warpPerspective(src, lastDetectedQuad);
  }

  if (!success) {
    let fallbackQuad = findCardQuad(src);
    if (fallbackQuad) {
      success = warpPerspective(src, fallbackQuad);
    }
  }

  if (!success) {
    cropFallbackROI(src);
  }

  const outputCanvas = document.getElementById('outputCanvas');
  const dataUrl = outputCanvas.toDataURL('image/jpeg', 0.9);
  
if (isFrontSide) {
    capturedImages.front = dataUrl;
    
    const guidePreview = document.getElementById('guidePreview');
    if (guidePreview) {
      guidePreview.src = dataUrl;
      guidePreview.style.display = 'block';
    }
    
    const previewFront = document.getElementById('previewFront');
    if (previewFront) {
      previewFront.src = dataUrl;
    }
  } else {
    capturedImages.back = dataUrl;
    
    const previewBack = document.getElementById('previewBack');
    if (previewBack) {
      previewBack.src = dataUrl;
    }

    // 裏面撮影完了時は単体ガイドプレビューを隠し、表裏縦並びコンテナを表示
    const guidePreview = document.getElementById('guidePreview');
    if (guidePreview) guidePreview.style.display = 'none';

    const previewContainer = document.getElementById('previewContainer');
    if (previewContainer) previewContainer.style.display = 'flex';
  }
  
  
  video.style.display = 'none';
  if (outputCanvas) outputCanvas.style.display = 'none';
  
  const guideFrame = document.getElementById('guide-frame');
  if (guideFrame) guideFrame.style.display = 'none';
  
  showActionUI();
  src.delete();
});

async function uploadAllImages() {
  const cloudRunUrl = 'https://upload-meishi-function-769951420007.asia-northeast2.run.app';
// セッションからユーザーコードを取得（未保持の場合は'unknown'）
  const userCode = sessionStorage.getItem('userCode') || 'unknown';
  
  if (capturedImages.front) {
    const frontPayload = {
      base64Data: capturedImages.front.split(',')[1],
      fileName: `card_${globalCardId}_${userCode}_front.jpg`
    };
    const res1 = await fetch(cloudRunUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(frontPayload)
    });
    if (!res1.ok) throw new Error("表面送信失敗: " + await res1.text());
  }

  if (capturedImages.back) {
    const backPayload = {
      base64Data: capturedImages.back.split(',')[1],
      fileName: `card_${globalCardId}_${userCode}_back.jpg`
    };
    const res2 = await fetch(cloudRunUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(backPayload)
    });
    if (!res2.ok) throw new Error("裏面送信失敗: " + await res2.text());
  }
  
  return true;
}

sendBtn.addEventListener('click', async () => {
  if (!capturedImages.front) {
    alert("表面が撮影されていません");
    return;
  }

  sendBtn.disabled = true;
  const originalText = sendBtn.textContent;
  sendBtn.textContent = "送信中...";

  try {
    await uploadAllImages();
    alert("送信完了しました");
    
    globalCardId = null;
    isFrontSide = true;
    capturedImages = { front: null, back: null };
    resetPreview();
    showCaptureUI();
  } catch (e) {
    alert("エラー: " + e.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = originalText;
  }
});

// GASからデータ取得
async function fetchCardsData() {
  const container = document.getElementById('card-container');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: "getCards" })
    });
    const result = await res.json();
    if (result.success) {
      allCardsData = result.cards;
      renderCards(allCardsData);
    } else {
      container.innerHTML = `<div style="text-align:center; padding: 20px; color: #ef4444;">取得失敗: ${result.message}</div>`;
    }
  } catch (e) {
    container.innerHTML = `<div style="text-align:center; padding: 20px; color: #ef4444;">通信エラーが発生しました</div>`;
  }
}
// ひらがな・カタカナ互換ヘルパー
function hiraToKata(str) {
  return str.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
}
function kataToHira(str) {
  return str.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
}

// リアルタイム検索処理（ひらがな・カタカナ・漢字対応）
document.getElementById('searchInput')?.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (!query) {
    renderCards(allCardsData);
    return;
  }

  const qKata = hiraToKata(query);
  const qHira = kataToHira(query);

  const filtered = allCardsData.filter(card => {
    const textGroup = [
      card.name, card.nameKana, card.company, card.companyKana,
      card.department, card.title, card.email, card.phone
    ].join(' ').toLowerCase();

    return textGroup.includes(query) || textGroup.includes(qKata) || textGroup.includes(qHira);
  });

  renderCards(filtered);
});

// Eight風カードの描写
function renderCards(dataList) {
  const container = document.getElementById('card-container');
  if (!container) return;
  container.innerHTML = "";

  if (!dataList || dataList.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">名刺データが見つかりません</div>`;
    return;
  }

  dataList.forEach(item => {
    const card = document.createElement('div');
    card.className = 'eight-card';
    card.onclick = () => openDetailModal(item);

    const thumbHtml = item.frontUrl ? `<img src="${item.frontUrl}" alt="名刺">` : `<span class="card-thumb-placeholder">No Img</span>`;

    card.innerHTML = `
      <div class="card-thumb-box">${thumbHtml}</div>
      <div class="card-info">
        <div class="card-name">
          ${item.name || "名称未設定"}
          ${item.nameKana ? `<span class="card-kana">${item.nameKana}</span>` : ''}
        </div>
        <p class="card-company">${item.company || "会社名なし"}</p>
        <div class="card-dept">${[item.department, item.title].filter(Boolean).join(' / ')}</div>
        <div class="card-date">更新: ${item.updatedAt || item.createdAt}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

// モーダル表示と編集データのセット
function openDetailModal(item) {
  document.getElementById('edit-rowIndex').value = item.rowIndex;
  document.getElementById('edit-company').value = item.company;
  document.getElementById('edit-companyKana').value = item.companyKana;
  document.getElementById('edit-name').value = item.name;
  document.getElementById('edit-nameKana').value = item.nameKana;
  document.getElementById('edit-department').value = item.department;
  document.getElementById('edit-title').value = item.title;
  document.getElementById('edit-phone').value = item.phone;
  document.getElementById('edit-mobile').value = item.mobile;
  document.getElementById('edit-email').value = item.email;
  document.getElementById('edit-zipCode').value = item.zipCode;
  document.getElementById('edit-address').value = item.address;

  const fImg = document.getElementById('m-front-img');

}

function closeDetailModal() {
  document.getElementById('detail-modal').style.display = 'none';
}

// 変更の保存処理（GASへ送信）
async function saveCardEdit() {
  const saveBtn = document.getElementById('saveCardBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = "保存中...";

  const payload = {
    action: "updateCard",
    rowIndex: document.getElementById('edit-rowIndex').value,
    userCode: sessionStorage.getItem('userCode') || 'unknown',
    userName: sessionStorage.getItem('userName') || '不明',
    company: document.getElementById('edit-company').value,
    companyKana: document.getElementById('edit-companyKana').value,
    name: document.getElementById('edit-name').value,
    nameKana: document.getElementById('edit-nameKana').value,
    department: document.getElementById('edit-department').value,
    title: document.getElementById('edit-title').value,
    phone: document.getElementById('edit-phone').value,
    mobile: document.getElementById('edit-mobile').value,
    email: document.getElementById('edit-email').value,
    zipCode: document.getElementById('edit-zipCode').value,
    address: document.getElementById('edit-address').value
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (result.success) {
      alert("更新を保存しました");
      closeDetailModal();
      fetchCardsData(); // 一覧を再取得
    } else {
      alert("更新失敗: " + result.message);
    }
  } catch (e) {
    alert("通信エラーが発生しました");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "変更を保存する";
  }
}
